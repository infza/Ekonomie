<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ekonomie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F11; --panel:#15171A; --panel2:#1A1D21; --line:#23262B; --line2:#2E3238;
  --text:#E8E9EC; --text2:#C9CCD2; --muted:#8A8F98; --dim:#4A4F57;
  --acc:#C6F432; --acc-bg:#1F2A0A; --acc2:#7AA2FF; --acc2-bg:#121C33;
  --bad:#FF7A6B; --bad-bg:#2A1412; --warn:#FFC857;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:Inter,system-ui,sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:260px;flex:none;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--acc);text-decoration:none;padding:0 12px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlbl{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);padding:0 12px 8px}
.navlink{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--text2);text-decoration:none;font-size:14px;border-left:2px solid transparent}
.navlink:hover{background:var(--panel2);color:var(--text)}
.navlink.on{background:var(--panel2);color:var(--text);border-left-color:var(--acc)}
.navlink .pct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.navlink.on .pct{color:var(--acc)}
.sidefoot{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 12px;line-height:1.7}
.sidefoot b{color:var(--acc);font-weight:600}
main{flex:1;min-width:0;padding:40px 48px 80px;max-width:1180px}
.bottomnav{display:none}

@media (max-width:860px){
  .side{display:none}
  main{padding-block:22px 100px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,17,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);z-index:20}
  .bottomnav a{text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px}
  .bottomnav a.on{color:var(--acc)}
  .bottomnav svg{width:20px;height:20px}
}

/* type */
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--text)}
h1{margin:0 0 6px;font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
h2{margin:0 0 14px;font-size:21px;font-weight:600;letter-spacing:-.2px}
h3{margin:0 0 8px;font-size:16px;font-weight:600}
p{line-height:1.65;color:var(--text2);margin:0 0 12px}
.lead{font-size:16px;color:var(--text2);margin-bottom:26px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
@media (max-width:860px){h1{font-size:27px}}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card+.card{margin-top:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:11px 16px;text-decoration:none;min-height:44px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);color:#0E0F11;border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:#d6ff55}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.acc{color:var(--acc);border-color:#3b4a14;background:var(--acc-bg)}
.tag.bad{color:var(--bad);border-color:#4a2420;background:var(--bad-bg)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s}

/* topic tiles */
.tile{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--dim);transform:translateY(-2px)}
.tile .num{font-family:var(--mono);font-size:12px;color:var(--acc)}
.tile .t{font-size:18px;font-weight:600;line-height:1.25}
.tile .d{font-size:13px;color:var(--muted);line-height:1.5}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--text)}
.stat .v.acc{color:var(--acc)}
.stat .l{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tabs a{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--text);border-bottom-color:var(--acc)}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start;margin-bottom:22px}
@media (max-width:1000px){.lesson{grid-template-columns:1fr}}
.lesson .txt h2{font-size:20px}
.lesson .txt ul{margin:0 0 12px;padding-left:18px;color:var(--text2);line-height:1.7}
.lesson .txt b{color:var(--text)}
.key{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.8;color:var(--text);margin:12px 0}
.key .k{color:var(--acc)}
.viz{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:20px}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz .ctrls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.viz .ctrls .btn{font-size:12px;padding:8px 11px;min-height:38px}
.viz .ctrls .btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.viz .explain{margin-top:12px;font-size:14px;line-height:1.55;color:var(--text2);min-height:44px;background:var(--bg);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.viz .explain b{color:var(--acc)}
.sl{display:grid;grid-template-columns:90px 1fr 60px;align-items:center;gap:10px;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sl output{color:var(--text);text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg text{font-family:var(--mono)}

/* practice */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:60px}
.cat:hover{border-color:var(--dim)}
.cat .n{font-weight:600;font-size:15px}
.cat .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.cat .r{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cat .bar{width:90px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 22px}
.dots a{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-decoration:none}
.dots a.ok{background:var(--acc-bg);border-color:#3b4a14;color:var(--acc)}
.dots a.ko{background:var(--bad-bg);border-color:#4a2420;color:var(--bad)}
.dots a.cur{border-color:var(--text);color:var(--text)}

.q{font-size:17px;line-height:1.6;color:var(--text);margin:0 0 18px}
.q b{color:var(--acc);font-weight:600}
.qsrc{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px}
table.t{border-collapse:collapse;font-family:var(--mono);font-size:13.5px;margin:4px 0 18px;min-width:100%}
table.t td,table.t th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.t th{color:var(--muted);font-weight:400}
table.t td:first-child,table.t th:first-child{text-align:left;color:var(--muted)}
.tw{overflow-x:auto}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;font-size:15px;line-height:1.45;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;min-height:52px;display:flex;gap:12px;align-items:flex-start}
.opt .l{font-family:var(--mono);color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.ok{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.opt.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.numin label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;min-width:140px}
.numin input{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:13px 14px;font-family:var(--mono);font-size:17px;min-height:50px}
.numin input:focus{border-color:var(--acc);outline:none}
.numin input.ok{border-color:var(--acc);color:var(--acc)}
.numin input.ko{border-color:var(--bad);color:var(--bad)}
.unit{font-family:var(--mono);color:var(--muted)}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;border:1px solid var(--line);background:var(--bg)}
.fb .h{font-family:var(--mono);font-size:13px;margin-bottom:10px}
.fb .h.ok{color:var(--acc)}.fb .h.ko{color:var(--bad)}
.sol{font-family:var(--mono);font-size:14px;line-height:1.9;color:var(--text2);white-space:pre-wrap;overflow-x:auto}
.sol .k{color:var(--acc)}
.solviz{margin-top:14px;max-width:420px}
.navq{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
@media (max-width:640px){.navq{display:grid;grid-template-columns:1fr 1fr}.navq .ghost{grid-column:1/-1;order:3}}

/* fraction */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* test */
.check{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:52px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.check.on{border-color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 16px;min-height:44px}
.seg button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.score{font-family:var(--mono);font-size:64px;font-weight:600;color:var(--acc);line-height:1}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:0 16px;margin-bottom:22px}
.search input{flex:1;background:transparent;border:none;padding:16px 0;font-size:17px;outline:none}
.search:focus-within{border-color:var(--acc)}
.res{display:block;text-decoration:none;color:var(--text);padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
.res:hover{border-color:var(--dim)}
.res .k{font-family:var(--mono);font-size:11px;color:var(--acc);margin-bottom:4px}
.res .x{font-size:14px;color:var(--text2);line-height:1.5}
mark{background:var(--acc-bg);color:var(--acc);border-radius:3px;padding:0 2px}

/* progress chart */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:160px;margin-top:10px}
.week .c{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:40px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s}
.week .b.z{background:var(--line2)}
.week .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.week .m{font-family:var(--mono);font-size:10.5px;color:var(--text2)}
.rowp{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowp:last-child{border-bottom:none}
.rowp .mono{font-size:12px;color:var(--muted);text-align:right}

/* formulas */
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:none}
.fx .f{font-family:var(--mono);font-size:15px;color:var(--acc)}
.fx .n{font-size:14px;color:var(--text2)}
@media (max-width:640px){.fx{grid-template-columns:1fr;gap:4px}}

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-size:13px;padding:10px 16px;border-radius:10px;z-index:50}

</style>
</head>
<body>
<script>
/* ===== Animované grafy ===== */
const C = { D:'#E8E9EC', S:'#C6F432', B:'#7AA2FF', R:'#FF7A6B', W:'#FFC857', dim:'#4A4F57', mut:'#8A8F98', ax:'#5A5F67' };

function frame(o){
  o = Object.assign({w:440,h:300,l:44,r:18,t:16,b:34,xmin:0,ymin:0},o);
  const X = x => o.l + (x-o.xmin)/(o.xmax-o.xmin)*(o.w-o.l-o.r);
  const Y = y => o.h-o.b - (y-o.ymin)/(o.ymax-o.ymin)*(o.h-o.t-o.b);
  const axes = (xl,yl) => `
    <line x1="${o.l}" y1="${o.t-8}" x2="${o.l}" y2="${o.h-o.b}" stroke="${C.ax}" stroke-width="1.5"/>
    <line x1="${o.l}" y1="${Y(Math.max(o.ymin,0))}" x2="${o.w-o.r+6}" y2="${Y(Math.max(o.ymin,0))}" stroke="${C.ax}" stroke-width="1.5"/>
    <path d="M${o.l-4} ${o.t-2} L${o.l} ${o.t-10} L${o.l+4} ${o.t-2}" fill="none" stroke="${C.ax}" stroke-width="1.5"/>
    <path d="M${o.w-o.r} ${Y(Math.max(o.ymin,0))-4} L${o.w-o.r+8} ${Y(Math.max(o.ymin,0))} L${o.w-o.r} ${Y(Math.max(o.ymin,0))+4}" fill="none" stroke="${C.ax}" stroke-width="1.5"/>
    <text x="${o.l+8}" y="${o.t-2}" fill="${C.mut}" font-size="11">${yl}</text>
    <text x="${o.w-o.r}" y="${Y(Math.max(o.ymin,0))+20}" fill="${C.mut}" font-size="11" text-anchor="end">${xl}</text>`;
  const fn = (f, x0, x1, n=80) => {
    let d='', pen=false;
    for(let i=0;i<=n;i++){
      const x = x0+(x1-x0)*i/n, y=f(x);
      if(!isFinite(y) || y>o.ymax*1.02 || y<o.ymin-(o.ymax-o.ymin)*0.02){pen=false;continue;}
      d += (pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' '; pen=true;
    }
    return d;
  };
  const line = (x1,y1,x2,y2,c,wd=2.5,dash='') => `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${c}" stroke-width="${wd}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round"/>`;
  const guide = (x,y,c=C.dim) => `<path d="M${o.l} ${Y(y)} L${X(x)} ${Y(y)} L${X(x)} ${Y(Math.max(o.ymin,0))}" fill="none" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  const dot = (x,y,c,r=6) => `<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${c}"/>`;
  const txt = (x,y,s,c=C.mut,size=12,anchor='start',dx=0,dy=0) => `<text x="${X(x)+dx}" y="${Y(y)+dy}" fill="${c}" font-size="${size}" text-anchor="${anchor}">${s}</text>`;
  const xt = (x,s) => `<text x="${X(x)}" y="${Y(Math.max(o.ymin,0))+16}" fill="${C.mut}" font-size="10.5" text-anchor="middle">${s}</text>`;
  const yt = (y,s) => `<text x="${o.l-6}" y="${Y(y)+4}" fill="${C.mut}" font-size="10.5" text-anchor="end">${s}</text>`;
  return {o,X,Y,axes,fn,line,guide,dot,txt,xt,yt};
}

const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function tweener(state, render){
  let raf=null;
  return function to(target, dur=700){
    cancelAnimationFrame(raf);
    const from = Object.assign({}, state), t0 = performance.now();
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) dur = 1;
    const step = now => {
      const k = Math.min(1,(now-t0)/dur), e = ease(k);
      for(const key in target) state[key] = from[key] + (target[key]-from[key])*e;
      render();
      if(k<1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
}
const fmt = (v,d=0) => (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('cs-CZ');

function vizShell(root, {legend='', ctrls='', sliders='', explain=''}){
  root.innerHTML = `<div class="viz"><svg viewBox="0 0 440 300" role="img" aria-label="Interaktivní graf"></svg>
    ${legend?`<div class="legend">${legend}</div>`:''}
    ${sliders}
    ${ctrls?`<div class="ctrls">${ctrls}</div>`:''}
    <div class="explain" aria-live="polite">${explain}</div></div>`;
  return { svg: root.querySelector('svg'), ex: root.querySelector('.explain') };
}
const lg = (c,t,dash) => `<span><i style="background:${dash?'transparent;border-top:2px dashed '+c:c}"></i>${t}</span>`;

/* ---------- 1a: posuny nabídky a poptávky ---------- */
const TRH_SC = [
  {k:'Příjmy ↑', ds:22, ss:0, t:'Lidi mají víc peněz → u normálního statku chtějí koupit víc při každé ceně. <b>Poptávka se posune doprava</b>, cena i množství rostou.'},
  {k:'Příjmy ↓', ds:-22, ss:0, t:'Méně peněz → menší poptávka. <b>D doleva</b>: cena i množství klesají.'},
  {k:'Substitut zdražil', ds:22, ss:0, t:'Náhrada (např. čaj místo kávy) zdražila → lidi přejdou k našemu statku. <b>D doprava</b>.'},
  {k:'Substitut zlevnil', ds:-22, ss:0, t:'Levnější náhrada přetáhne zákazníky. <b>D doleva</b> – jako levný čaj u trhu kávy.'},
  {k:'Komplement zdražil', ds:-22, ss:0, t:'Doplněk (benzín k autům) zdražil → statek chce méně lidí. <b>D doleva</b>.'},
  {k:'Náklady ↑', ds:0, ss:-22, t:'Dražší vstupy (mzdy, suroviny, energie) → firmy nabízí méně. <b>S doleva</b>: cena roste, množství klesá.'},
  {k:'Technologie', ds:0, ss:22, t:'Levnější výroba → firmy nabídnou víc. <b>S doprava</b>: cena klesá, množství roste.'},
  {k:'Dotace firmám', ds:0, ss:22, t:'Dotace snižuje náklady výrobců. <b>S doprava</b>.'},
  {k:'Daň ↑ (DPH)', ds:0, ss:-22, t:'Daň zvyšuje náklady prodeje. <b>S doleva</b>: vyšší cena, nižší množství.'},
  {k:'D i S doprava', ds:22, ss:22, t:'Obě křivky doprava → <b>množství jistě roste</b>, cena se nemusí změnit (záleží, která se posune víc).'}
];
function vizTrh(root){
  const ctrls = TRH_SC.map((s,i)=>`<button class="btn" data-i="${i}">${s.k}</button>`).join('') + `<button class="btn ghost" data-r>↺ zpět</button>`;
  const {svg,ex} = vizShell(root,{ctrls, legend: lg(C.D,'D – poptávka')+lg(C.S,'S – nabídka')+lg(C.dim,'původní stav',1),
    explain:'Klikni na změnu a sleduj, která křivka se pohne a co to udělá s rovnováhou <b>E</b>.'});
  const st = {ds:0, ss:0};
  const F = frame({xmax:100, ymax:10});
  const D = (q,ds) => 9 - 0.08*(q-ds), S = (q,ss) => 1 + 0.08*(q-ss);
  const eq = (ds,ss) => { const q = 50+(ds+ss)/2; return [q, D(q,ds)]; };
  const render = () => {
    const [q0,p0] = eq(0,0), [q1,p1] = eq(st.ds, st.ss);
    const moved = Math.abs(st.ds)>.5 || Math.abs(st.ss)>.5;
    let s = F.axes('Q','P');
    if(moved){
      s += `<path d="${F.fn(q=>D(q,0),0,100)}" stroke="${C.dim}" stroke-width="2" fill="none" stroke-dasharray="6 5"/>`;
      s += `<path d="${F.fn(q=>S(q,0),0,100)}" stroke="${C.dim}" stroke-width="2" fill="none" stroke-dasharray="6 5"/>`;
      s += F.guide(q0,p0) + F.dot(q0,p0,C.dim,5) + F.txt(q0,p0,'E',C.mut,12,'start',8,-8);
    }
    s += `<path d="${F.fn(q=>D(q,st.ds),0,100)}" stroke="${C.D}" stroke-width="2.8" fill="none"/>`;
    s += `<path d="${F.fn(q=>S(q,st.ss),0,100)}" stroke="${C.S}" stroke-width="2.8" fill="none"/>`;
    const qd = Math.min(97, st.ds + 8.4/0.08), qs = Math.min(97, st.ss + 8.6/0.08);
    s += F.txt(qd, D(qd,st.ds), Math.abs(st.ds)>.5?"D'":'D', C.D, 13, 'end', 0, -10);
    s += F.txt(qs, S(qs,st.ss), Math.abs(st.ss)>.5?"S'":'S', C.S, 13, 'start', 6, 14);
    s += F.guide(q1,p1,'#6b7178') + F.dot(q1,p1,C.S) + F.txt(q1,p1,moved?"E'":'E',C.S,13,'start',10,-10);
    s += F.yt(p1,'P'+(moved?'₁':'*')) + F.xt(q1,'Q'+(moved?'₁':'*'));
    if(moved){
      const dp = p1-p0, dq = q1-q0;
      s += `<text x="${F.X(50)}" y="18" fill="#E8E9EC" font-size="12" text-anchor="middle">P ${Math.abs(dp)<.05?'beze změny':dp>0?'↑':'↓'}   Q ${Math.abs(dq)<.3?'beze změny':dq>0?'↑':'↓'}</text>`;
    }
    svg.innerHTML = s;
  };
  const to = tweener(st, render);
  root.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const sc = TRH_SC[+b.dataset.i];
    root.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('on',x===b));
    ex.innerHTML = sc.t; to({ds:sc.ds, ss:sc.ss});
  });
  root.querySelector('[data-r]').onclick=()=>{root.querySelectorAll('[data-i]').forEach(x=>x.classList.remove('on')); ex.innerHTML='Výchozí stav – rovnováha <b>E</b>, kde se protíná D a S.'; to({ds:0,ss:0});};
  render();
}

/* ---------- 1b: cena mimo rovnováhu (trdelníky) ---------- */
function vizTrhCena(root){
  const sliders = `<div class="sl"><span>cena P</span><input type="range" min="45" max="70" step="1" value="66" aria-label="Cena"><output>66 Kč</output></div>`;
  const {svg,ex} = vizShell(root,{sliders, legend: lg(C.D,'Qd = 430 − 4P')+lg(C.S,'Qs = 10P − 410')});
  const st = {p:66};
  const F = frame({xmax:320, ymax:75, ymin:40, l:44});
  const Qd = p => 430-4*p, Qs = p => 10*p-410;
  const render = () => {
    const p = st.p, qd=Qd(p), qs=Qs(p);
    let s = F.axes('Q (ks)','P (Kč)');
    [45,50,55,60,65,70].forEach(v=> s += F.yt(v,v));
    [100,200,300].forEach(v=> s += F.xt(v,v));
    s += `<path d="${F.fn(q=>(430-q)/4,0,320)}" stroke="${C.D}" stroke-width="2.6" fill="none"/>`;
    s += `<path d="${F.fn(q=>(q+410)/10,0,320)}" stroke="${C.S}" stroke-width="2.6" fill="none"/>`;
    s += F.txt(130,75,'D',C.D,13,'start',0,14) + F.txt(300,71,'S',C.S,13,'start',6,4);
    s += F.dot(190,60,'#6b7178',4) + F.txt(190,60,'E',C.mut,11,'start',6,14);
    s += F.line(0,p,320,p,C.W,1.5,'5 4');
    const lo=Math.min(qd,qs), hi=Math.max(qd,qs);
    if(hi-lo>1){
      const c = qs>qd? C.R : C.B;
      s += `<line x1="${F.X(Math.max(lo,0))}" y1="${F.Y(p)}" x2="${F.X(hi)}" y2="${F.Y(p)}" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity=".85"/>`;
      s += F.txt((lo+hi)/2,p,(qs>qd?'přebytek ':'nedostatek ')+Math.round(hi-lo)+' ks',c,12,'middle',0,-12);
      const ay = qs>qd ? -1 : 1;
      s += `<path d="M${F.X(16)} ${F.Y(p)+ay*-6} l0 ${ay*22} m-5 ${-ay*8} l5 ${ay*8} l5 ${-ay*8}" stroke="${C.W}" stroke-width="2" fill="none"/>`;
    }
    s += F.dot(Math.max(qd,0),p,C.D,5) + F.dot(Math.max(qs,0),p,C.S,5);
    svg.innerHTML = s;
    const pr = Math.round(p);
    root.querySelector('output').textContent = pr+' Kč';
    ex.innerHTML = pr>60 ? `Při <b>${pr} Kč</b> chtějí firmy prodat ${Qs(pr)} ks, ale lidi koupí jen ${Qd(pr)} ks → <b>přebytek ${Qs(pr)-Qd(pr)} ks</b>. Prodejci zlevňují, cena klesá k 60 Kč.`
      : pr<60 ? `Při <b>${pr} Kč</b> chtějí lidi ${Qd(pr)} ks, ale nabízí se jen ${Math.max(Qs(pr),0)} ks → <b>nedostatek ${Qd(pr)-Math.max(Qs(pr),0)} ks</b>. Kupující přeplácí, cena roste k 60 Kč.`
      : `<b>Rovnováha!</b> Při 60 Kč je Qd = Qs = 190 ks. Trh je vyčištěný, nikdo nemá důvod cenu měnit.`;
  };
  const inp = root.querySelector('input'), to = tweener(st, render);
  inp.oninput = () => to({p:+inp.value}, 250);
  render();
}

/* ---------- 2a: TU a MU (kardinalisté) ---------- */
function vizTU(root){
  const TU = [0,155,244,324,366,390,400,396];
  const sliders = `<div class="sl"><span>množství Q</span><input type="range" min="1" max="7" step="1" value="3" aria-label="Množství"><output>3</output></div>
    <div class="sl"><span>cena P</span><input type="range" min="10" max="160" step="1" value="80" aria-label="Cena"><output>80 Kč</output></div>`;
  const {svg,ex} = vizShell(root,{sliders, legend: lg(C.S,'TU – celkový užitek')+lg(C.B,'MU – mezní užitek')+lg(C.W,'cena P',1)});
  const st = {q:3, p:80};
  const T = frame({h:300,t:14,b:166,xmax:7.6,ymax:420});
  const M = frame({h:300,t:158,b:24,xmax:7.6,ymax:200,ymin:-20});
  const render = () => {
    const q = Math.round(st.q), p = st.p;
    let s = `<text x="44" y="12" fill="${C.mut}" font-size="11">TU (Kč)</text>
      <line x1="44" y1="6" x2="44" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${T.Y(0)}" x2="428" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
      <line x1="44" y1="152" x2="44" y2="${M.Y(-20)}" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${M.Y(0)}" x2="428" y2="${M.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
      <text x="50" y="150" fill="${C.mut}" font-size="11">MU (Kč)</text>`;
    let d=''; for(let i=0;i<TU.length;i++) d+=(i?'L':'M')+T.X(i)+' '+T.Y(TU[i])+' ';
    s += `<path d="${d}" stroke="${C.S}" stroke-width="2.6" fill="none"/>`;
    for(let i=1;i<TU.length;i++){
      const mu = TU[i]-TU[i-1], on = i<=q, buy = mu>=p;
      const x0 = M.X(i-.38), x1 = M.X(i+.38), y = M.Y(Math.max(mu,0)), y0=M.Y(0), yy = M.Y(Math.min(mu,0));
      s += `<rect x="${x0}" y="${mu>=0?y:y0}" width="${x1-x0}" height="${Math.abs((mu>=0?y0:yy)-(mu>=0?y:y0))}" rx="3" fill="${C.B}" opacity="${on?1:.25}"/>`;
      s += `<text x="${(x0+x1)/2}" y="${(mu>=0?y:yy)+(mu>=0?-5:13)}" fill="${on?C.B:C.dim}" font-size="10.5" text-anchor="middle">${mu}</text>`;
      s += `<text x="${(x0+x1)/2}" y="298" fill="${C.mut}" font-size="10.5" text-anchor="middle">${i}</text>`;
      s += T.dot(i,TU[i], i<=q?C.S:C.dim, i===q?6:3.5);
    }
    s += `<line x1="44" y1="${M.Y(p)}" x2="428" y2="${M.Y(p)}" stroke="${C.W}" stroke-width="1.6" stroke-dasharray="6 4"/>`;
    s += `<text x="428" y="${M.Y(p)-5}" fill="${C.W}" font-size="11" text-anchor="end">P = ${Math.round(p)}</text>`;
    s += `<text x="${T.X(q)}" y="${T.Y(TU[q])-12}" fill="${C.S}" font-size="12" text-anchor="middle">TU=${TU[q]}</text>`;
    svg.innerHTML = s;
    root.querySelectorAll('output')[0].textContent = q;
    root.querySelectorAll('output')[1].textContent = Math.round(p)+' Kč';
    let opt=0; for(let i=1;i<TU.length;i++) if(TU[i]-TU[i-1]>=Math.round(p)) opt=i;
    const cs = TU[q] - Math.round(p)*q;
    ex.innerHTML = `Při Q = ${q}: TU = ${TU[q]} Kč, zaplatíš ${q}·${Math.round(p)} = ${q*Math.round(p)} Kč → <b>CS = ${cs} Kč</b>. `+
      (q===opt ? `<b>Optimum</b> – další kus by měl MU < P.` : q<opt ? `Vyplatí se koupit další kus (jeho MU ≥ P). Optimum je Q = ${opt}.` : `Přestřelil jsi – poslední kus má MU < P. Optimum je Q = ${opt}.`)+
      (q===7?' 7. kus má <b>MU záporný</b> → TU klesá (přesycení).':'');
  };
  const [i1,i2] = root.querySelectorAll('input'), to = tweener(st, render);
  i1.oninput = () => { st.q=+i1.value; render(); };
  i2.oninput = () => to({p:+i2.value}, 200);
  render();
}

/* ---------- 2b: linie rozpočtu + indiferenční křivka ---------- */

/* ---------- 3: produkční funkce TP / AP / MP ---------- */
function vizProd(root){
  const a=50,b=25,c=3;
  const TP=L=>a*L+b*L*L-c*L*L*L, AP=L=>a+b*L-c*L*L, MP=L=>a+2*b*L-3*c*L*L;
  const sliders = `<div class="sl"><span>práce L</span><input type="range" min="0.5" max="7.5" step="0.1" value="2" aria-label="Práce"><output></output></div>`;
  const {svg,ex} = vizShell(root,{sliders, legend: lg(C.S,'TP')+lg(C.B,'AP')+lg(C.W,'MP')});
  const st={L:2};
  const T = frame({h:300,t:14,b:166,xmax:7.6,ymax:620});
  const M = frame({h:300,t:156,b:22,xmax:7.6,ymax:140,ymin:-60});
  const Lmp=b/(3*c), Lap=b/(2*c), Ltp=(2*b+Math.sqrt(4*b*b+12*c*a))/(6*c);
  const render = () => {
    const L=st.L;
    let s = `<line x1="44" y1="6" x2="44" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${T.Y(0)}" x2="428" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
     <line x1="44" y1="150" x2="44" y2="278" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${M.Y(0)}" x2="428" y2="${M.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
     <text x="50" y="12" fill="${C.mut}" font-size="11">TP (Q)</text><text x="50" y="158" fill="${C.mut}" font-size="11">AP, MP</text><text x="428" y="294" fill="${C.mut}" font-size="11" text-anchor="end">L</text>`;
    [[0,Lap,'I.'],[Lap,Ltp,'II.'],[Ltp,7.6,'III.']].forEach(([x0,x1,n],i)=>{
      s += `<rect x="${T.X(x0)}" y="6" width="${T.X(x1)-T.X(x0)}" height="272" fill="${['#C6F432','#7AA2FF','#FF7A6B'][i]}" opacity="0.045"/>`;
      s += `<text x="${(T.X(x0)+T.X(x1))/2}" y="130" fill="${C.dim}" font-size="11" text-anchor="middle">${n} st.</text>`;
    });
    [Lap,Ltp].forEach(x=> s+=`<line x1="${T.X(x)}" y1="6" x2="${T.X(x)}" y2="278" stroke="${C.dim}" stroke-dasharray="3 4"/>`);
    s += `<path d="${T.fn(TP,0,7.6)}" stroke="${C.S}" stroke-width="2.6" fill="none"/>`;
    s += `<path d="${M.fn(AP,0,7.6)}" stroke="${C.B}" stroke-width="2.4" fill="none"/>`;
    s += `<path d="${M.fn(MP,0,7.6)}" stroke="${C.W}" stroke-width="2.4" fill="none"/>`;
    s += `<line x1="${T.X(L)}" y1="6" x2="${T.X(L)}" y2="278" stroke="${C.D}" stroke-width="1" opacity=".5"/>`;
    s += T.dot(L,TP(L),C.S,5.5) + M.dot(L,AP(L),C.B,5) + M.dot(L,MP(L),C.W,5);
    svg.innerHTML = s;
    root.querySelector('output').textContent = fmt(L,1);
    const stage = L<Lap?'I.':L<Ltp?'II.':'III.';
    ex.innerHTML = `L = ${fmt(L,1)}: TP = <b>${fmt(TP(L),1)}</b>, AP = ${fmt(AP(L),1)}, MP = ${fmt(MP(L),1)}. ${stage} stádium. `+
      (L<Lmp?'MP roste – rostoucí výnosy.': L<Lap?'MP už klesá, ale je nad AP → AP ještě roste.': L<Ltp?'<b>Racionální stádium</b>: MP < AP, ale MP > 0.':'<b>MP < 0</b> – další pracovník produkci snižuje!');
  };
  const inp=root.querySelector('input'), to=tweener(st,render);
  inp.oninput=()=>to({L:+inp.value},180);
  render();
}

/* ---------- 4: náklady ---------- */
function vizNaklady(root){
  const sliders = `<div class="sl"><span>množství Q</span><input type="range" min="1" max="10" step="0.1" value="4" data-k="q" aria-label="Množství"><output></output></div>

  const T = frame({h:300,t:14,b:166,xmax:10.4,ymax:340});

    const {q,fc}=st, TC=x=>fc+VC(x), AC=x=>fc/x+AVC(x);

     <text x="50" y="12" fill="${C.mut}" font-size="11">Kč</text><text x="50" y="158" fill="${C.mut}" font-size="11">Kč / ks</text><text x="428" y="294" fill="${C.mut}" font-size="11" text-anchor="end">Q</text>`;
    s += `<path d="${T.fn(()=>fc,0,10.4)}" stroke="${C.mut}" stroke-width="2" fill="none" stroke-dasharray="6 4"/>`;

    s += `<path d="${M.fn(AVC,0.3,10.4)}" stroke="${C.D}" stroke-width="2.2" fill="none"/>`;
    s += `<path d="${M.fn(AC,0.8,10.4)}" stroke="${C.W}" stroke-width="2.4" fill="none"/>`;
    s += M.dot(6,AVC(6),C.D,4);
    let qa=1; for(let x=1;x<10;x+=.01) if(MC(x)>=AC(x)){qa=x;break;}
    s += M.dot(qa,AC(qa),C.W,4);
    s += `<line x1="${T.X(q)}" y1="6" x2="${T.X(q)}" y2="${M.Y(0)}" stroke="${C.D}" opacity=".45"/>`;
    s += T.dot(q,TC(q),C.S,5) + T.dot(q,VC(q),C.B,4.5) + M.dot(q,MC(q),C.R,4.5) + M.dot(q,AC(q),C.W,4.5) + M.dot(q,AVC(q),C.D,4.5);
    s += `<line x1="${T.X(q)+10}" y1="${T.Y(TC(q))}" x2="${T.X(q)+10}" y2="${T.Y(VC(q))}" stroke="${C.mut}" stroke-width="1.5"/><text x="${T.X(q)+14}" y="${(T.Y(TC(q))+T.Y(VC(q)))/2+4}" fill="${C.mut}" font-size="10.5">FC</text>`;
    svg.innerHTML=s;
    const o=root.querySelectorAll('output'); o[0].textContent=fmt(q,1); o[1].textContent=Math.round(fc);

  };
  const to=tweener(st,render);
  root.querySelectorAll('input').forEach(i=>i.oninput=()=>to({[i.dataset.k]:+i.value},200));
  render();
}

/* ---------- 5: příjmy a zisk ---------- */
function vizZisk(root){
  const sliders = `<div class="sl"><span>množství Q</span><input type="range" min="1" max="11" step="0.1" value="5" aria-label="Množství"><output></output></div>`;
  const ctrls = `<button class="btn on" data-m="0">Dokonalá konkurence (P = 40)</button><button class="btn" data-m="1">Monopol (P = 100 − 5Q)</button>`;
  const {svg,ex} = vizShell(root,{sliders, ctrls, legend: lg(C.S,'TR')+lg(C.D,'TC')+lg(C.B,'MR')+lg(C.R,'MC')});
  const st={q:5, m:0};
  const TC=q=>60+30*q-6*q*q+.5*q*q*q, MC=q=>30-12*q+1.5*q*q;
  const T = frame({h:300,t:14,b:166,xmax:11.4,ymax:620});
  const M = frame({h:300,t:156,b:22,xmax:11.4,ymax:110,ymin:-10});
  const render=()=>{
    const m=st.m, q=st.q;
    const TR=x=>(1-m)*40*x + m*(100-5*x)*x, MR=x=>(1-m)*40 + m*(100-10*x);
    let s = `<line x1="44" y1="6" x2="44" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${T.Y(0)}" x2="428" y2="${T.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
     <line x1="44" y1="150" x2="44" y2="${M.Y(-10)}" stroke="${C.ax}" stroke-width="1.5"/><line x1="44" y1="${M.Y(0)}" x2="428" y2="${M.Y(0)}" stroke="${C.ax}" stroke-width="1.5"/>
     <text x="50" y="12" fill="${C.mut}" font-size="11">Kč</text><text x="50" y="158" fill="${C.mut}" font-size="11">Kč / ks</text><text x="428" y="294" fill="${C.mut}" font-size="11" text-anchor="end">Q</text>`;
    const pi = TR(q)-TC(q);
    s += `<line x1="${T.X(q)}" y1="${T.Y(TR(q))}" x2="${T.X(q)}" y2="${T.Y(TC(q))}" stroke="${pi>=0?C.S:C.R}" stroke-width="7" opacity=".35" stroke-linecap="round"/>`;
    s += `<path d="${T.fn(TC,0,11.4)}" stroke="${C.D}" stroke-width="2.4" fill="none"/>`;
    s += `<path d="${T.fn(TR,0,11.4)}" stroke="${C.S}" stroke-width="2.6" fill="none"/>`;
    s += `<path d="${M.fn(MC,0.2,11.4)}" stroke="${C.R}" stroke-width="2.4" fill="none"/>`;
    s += `<path d="${M.fn(MR,0,11.4)}" stroke="${C.B}" stroke-width="2.4" fill="none"/>`;
    let qo=1; for(let x=4;x<11.4;x+=.005) if(MC(x)>=MR(x)){qo=x;break;}
    s += M.dot(qo,MR(qo),C.S,5) + M.txt(qo,MR(qo),'MR = MC',C.S,11,'start',8,-8);
    s += `<line x1="${T.X(q)}" y1="6" x2="${T.X(q)}" y2="${M.Y(-10)}" stroke="${C.D}" opacity=".4"/>`;
    s += T.dot(q,TR(q),C.S,5) + T.dot(q,TC(q),C.D,5);
    s += `<text x="${T.X(q)+10}" y="${(T.Y(TR(q))+T.Y(TC(q)))/2+4}" fill="${pi>=0?C.S:C.R}" font-size="12">π = ${fmt(pi,0)}</text>`;
    svg.innerHTML=s;
    root.querySelector('output').textContent=fmt(q,1);
    ex.innerHTML=`Q = ${fmt(q,1)}: TR = ${fmt(TR(q),0)}, TC = ${fmt(TC(q),0)} → <b>π = ${fmt(pi,0)} Kč</b>. `+
      `Zisk je nejvyšší při <b>Q ≈ ${fmt(qo,1)}</b>, kde MR = MC.` + (m? ' U monopolu MR klesá 2× rychleji než cena.' : ' V dokonalé konkurenci P = AR = MR.');
  };
  const to=tweener(st,render), inp=root.querySelector('input');
  inp.oninput=()=>to({q:+inp.value},180);
  root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{root.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b)); to({m:+b.dataset.m},800);});
  render();
}

/* ---------- mini graf do řešení příkladů ---------- */
function miniShift(sh){ // sh: 'D+','D-','S+','S-'
  const F = frame({w:300,h:200,l:24,r:14,t:14,b:24,xmax:100,ymax:10});
  const ds = sh==='D+'?22:sh==='D-'?-22:0, ss = sh==='S+'?22:sh==='S-'?-22:0;
  const D=(q,d)=>9-0.08*(q-d), S=(q,s)=>1+0.08*(q-s);
  let s = F.axes('Q','P');
  s += `<path d="${F.fn(q=>D(q,0),0,100)}" stroke="${ds?C.dim:C.D}" stroke-width="2" fill="none" ${ds?'stroke-dasharray="5 4"':''}/>`;
  s += `<path d="${F.fn(q=>S(q,0),0,100)}" stroke="${ss?C.dim:C.S}" stroke-width="2" fill="none" ${ss?'stroke-dasharray="5 4"':''}/>`;
  if(ds) s += `<path d="${F.fn(q=>D(q,ds),0,100)}" stroke="${C.D}" stroke-width="2.6" fill="none"/>` + F.txt(96,D(96,ds),"D'",C.D,12,'end',0,-8);
  if(ss) s += `<path d="${F.fn(q=>S(q,ss),0,100)}" stroke="${C.S}" stroke-width="2.6" fill="none"/>` + F.txt(96,S(96,ss),"S'",C.S,12,'end',0,16);
  const q1=50+(ds+ss)/2, p1=D(q1,ds);
  s += F.dot(50,5,C.dim,4) + F.dot(q1,p1,C.S,5) + F.txt(q1,p1,"E'",C.S,11,'start',7,-6);
  return `<svg viewBox="0 0 300 200" role="img" aria-label="Graf posunu křivky">${s}</svg>`;
}

const tbl = (rows) => `<div class="tw"><table class="t">${rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const tblH = (rows) => `<div class="tw"><table class="t">${rows.map(r=>`<tr>${r.map((c,j)=>j===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ri = (r,a,b) => a+Math.floor(r()*(b-a+1));
const pk = (r,arr) => arr[Math.floor(r()*arr.length)];
function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

const QS = [];
function add(topic, cat, o){ QS.push(Object.assign({id: topic+'-'+cat+'-'+(QS.filter(q=>q.topic===topic&&q.cat===cat).length+1), topic, cat}, o)); }
// mc s první odpovědí správnou -> zamíchá se
function mc(topic, cat, q, opts, sol, extra={}){
  const r = rng(QS.length*7919+13);
  const order = shuffle(opts.map((_,i)=>i), r);
  add(topic, cat, Object.assign({type:'mc', q, opts: order.map(i=>opts[i]), ans: order.indexOf(0), sol}, extra));
}
function num(topic, cat, q, fields, sol, extra={}){ add(topic, cat, Object.assign({type:'num', q, fields, sol}, extra)); }

}

function costTable(fc, mcs){ const tc=[fc]; mcs.forEach((m,i)=>tc.push(tc[i]+m)); return tc; }
function tabQ(fc, mcs, ks, src){
  const tc=costTable(fc,mcs); const qs=tc.map((_,i)=>i);
  ks.forEach(k=>{
    const vc=tc[k]-fc, mc_=tc[k]-tc[k-1], afc=fc/k, avc=vc/k, ac=tc[k]/k;
    num('naklady','tab',`Doplň tabulku pro <b>Q = ${k}</b>.${tblH([['Q',...qs],['TC',...tc]])}`,

  document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on', a.dataset.r===base || (base==='/' && a.dataset.r==='/')));
  if(p[0]==='t') document.querySelectorAll('[data-r]').forEach(a=>a.classList.remove('on'));
  sideTopics(p[0]==='t'?p[1]:null);
  m.className='fade'; void m.offsetWidth;
  if(!p.length) vHome(m);
  else if(p[0]==='t' && TOP[p[1]]){
    S.last = p[1]; save();
    if(!p[2]) vLesson(m, p[1]);
    else if(p[2]==='p' && !p[3]) vCats(m, p[1]);
    else if(p[2]==='p') vPractice(m, p[1], p[3], +(p[4]||0));
    else if(p[2]==='f') vTopicFx(m, p[1]);
  }
  else if(p[0]==='test') vTest(m);
  else if(p[0]==='hledat') vSearch(m, decodeURIComponent((qstr||'').replace(/^q=/,'')));
  else if(p[0]==='pokrok') vProgress(m);
  else if(p[0]==='vzorce') vFx(m);
  else vHome(m);
  window.scrollTo(0,0);
}

/* ---------- otázka ---------- */
function parseNum(s){
  s = String(s).trim().replace(/\s/g,'').replace(/−/g,'-').replace(',', '.');
  if(!s) return NaN;
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){ const [a,b]=s.split('/').map(Number); return a/b; }
  return Number(s);
}
const near = (v, ans, tol) => Math.abs(v-ans) <= (tol!=null ? Math.max(tol,0.051) : (Number.isInteger(ans) ? 0.001 : 0.051));
function renderQ(box, q, {mode, idx, total, onDone, onAnswer}){
  const L = 'ABCDEFGH';
  const head = `<div class="qsrc">${mode==='test'?`otázka ${idx} / ${total}`:`příklad ${idx} / ${total}`}${q.src?' · '+esc(q.src):''}${mode==='test'?' · '+TOP[q.topic].name:''}</div><div class="q">${q.q}</div>`;
  if(q.type==='mc'){
    box.innerHTML = head + `<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${o}</span></button>`).join('')}</div><div id="fb"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j = +b.dataset.j, ok = j===q.ans;
      if(mode==='test'){ onAnswer && onAnswer(ok, j); return; }
      box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; const k=+x.dataset.j; if(k===q.ans) x.classList.add('ok'); else if(k===j) x.classList.add('ko'); });
      feedback(box, q, ok); onDone && onDone(ok);
    });
  } else {
    box.innerHTML = head + `<form class="numin" novalidate>${q.fields.map((f,j)=>`<label>${esc(f.l)}${f.unit?` <span class="unit">[${esc(f.unit)}]</span>`:''}<input inputmode="decimal" autocomplete="off" data-j="${j}" aria-label="${esc(f.l)}"></label>`).join('')}</form>
      <div class="btns" style="margin-top:14px"><button class="btn pri" id="chk">${mode==='test'?'Odpovědět →':'Zkontrolovat'}</button>${mode==='practice'?'<button class="btn ghost" id="show">Ukázat řešení</button>':''}</div><div id="fb"></div>`;
    const ins = [...box.querySelectorAll('input')];
    if(matchMedia('(min-width: 861px)').matches) ins[0].focus();
    const check = (giveUp) => {
      const res = ins.map((inp,j)=>near(parseNum(inp.value), q.fields[j].ans, q.fields[j].tol));
      const ok = !giveUp && res.every(Boolean);
      if(mode==='test'){ onAnswer && onAnswer(ok, ins.map(i=>i.value)); return; }
      ins.forEach((inp,j)=>{ inp.classList.toggle('ok',res[j]&&!giveUp); inp.classList.toggle('ko',!res[j]||giveUp); inp.readOnly=true; });
      $('#chk',box).disabled = true; const sh=$('#show',box); if(sh) sh.disabled=true;
      feedback(box, q, ok); onDone && onDone(ok);
    };
    $('#chk',box).onclick = () => check(false);
    const sh=$('#show',box); if(sh) sh.onclick = () => check(true);
    box.querySelector('form').onsubmit = e => { e.preventDefault(); check(false); };
    ins.forEach((inp,j)=>inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(j<ins.length-1) ins[j+1].focus(); else check(false);} });
  }
}
function feedback(box, q, ok){
  const correct = q.type==='mc' ? '' : `<div class="mono" style="font-size:13px;color:var(--text2);margin-bottom:10px">Správně: ${q.fields.map(f=>`${esc(f.l)} = <span style="color:var(--acc)">${nf(f.ans)}</span>`).join(' · ')}</div>`;
  $('#fb',box).innerHTML = `<div class="fb fade"><div class="h ${ok?'ok':'ko'}">${ok?'✓ Správně!':'✗ Tentokrát ne – mrkni na postup'}</div>${correct}<div class="sol">${q.sol}</div>${q.viz?`<div class="solviz">${miniShift(q.viz)}</div>`:''}</div>`;
}

/* ---------- test ---------- */
const TEST = { pre:null, run:null };
function vTest(m){
  if(TEST.run && !TEST.run.done) return testRun(m);
  if(TEST.run && TEST.run.done) return testResult(m);
  const sel = new Set(TEST.pre || TOPICS.map(t=>t.id)); TEST.pre=null;
  let n = 20, onlyNew = false;
  const draw = () => {
    const pool = QS.filter(q=>sel.has(q.topic) && (!onlyNew || !(S.res[q.id]&&S.res[q.id].ok)));
    m.innerHTML = `<div class="crumb"><a href="#/">ekonomie</a> / test</div><h1>Test nanečisto</h1><p class="lead">Vyber témata a počet otázek. Výsledek a postupy uvidíš až na konci.</p>
      <div class="card"><h3>Témata</h3><div class="grid g2" style="margin-top:10px">${TOPICS.map(t=>`<label class="check ${sel.has(t.id)?'on':''}"><input type="checkbox" data-t="${t.id}" ${sel.has(t.id)?'checked':''}><span><b>${t.n}</b> ${t.name} <span class="muted mono" style="font-size:11px">· ${qsOf(t.id).length}</span></span></label>`).join('')}</div>
      <div class="btns" style="margin-top:12px"><button class="btn ghost" id="all">vybrat vše</button><button class="btn ghost" id="none">zrušit vše</button></div></div>
      <div class="card"><h3>Počet otázek</h3><div class="seg" style="margin-top:10px">${[10,20,30,50].map(v=>`<button data-n="${v}" class="${v===n?'on':''}">${v}</button>`).join('')}</div>
      <label class="check ${onlyNew?'on':''}" style="margin-top:14px"><input type="checkbox" id="new" ${onlyNew?'checked':''}><span>Jen příklady, které ještě nemám vyřešené</span></label></div>
      <div class="btns" style="margin-top:20px"><button class="btn pri" id="go" ${pool.length?'':'disabled'}>Spustit test (${Math.min(n,pool.length)} otázek)</button></div>`;
    m.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.dataset.t):sel.delete(c.dataset.t); draw(); });
    m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ n=+b.dataset.n; draw(); });
    $('#new',m).onchange = e => { onlyNew = e.target.checked; draw(); };
    $('#all',m).onclick=()=>{ TOPICS.forEach(t=>sel.add(t.id)); draw(); };
    $('#none',m).onclick=()=>{ sel.clear(); draw(); };
    $('#go',m).onclick=()=>{
      const r = rng(Date.now()); const picked = shuffle(pool, r).slice(0, n);
      TEST.run = { qs:picked, i:0, ans:[], topics:[...sel], start:Date.now(), done:false };
      testRun(m);
    };
  };
  draw();
}
function testRun(m){
  const R = TEST.run, q = R.qs[R.i];
  m.innerHTML = `<div class="head"><div><div class="crumb">test</div><h1 style="font-size:26px">Otázka ${R.i+1} z ${R.qs.length}</h1></div><button class="btn ghost" id="quit">Ukončit test</button></div>
    <div class="bar" style="margin-bottom:22px"><i style="width:${100*R.i/R.qs.length}%"></i></div><div class="card" id="qbox"></div>`;
  twoStep($('#quit',m), 'Klikni znovu – zbytek bude špatně', ()=>{ while(R.ans.length<R.qs.length) R.ans.push({ok:false,v:null}); finish(); });
  const finish = () => { R.done=true; R.end=Date.now(); R.qs.forEach((x,j)=>record(x,R.ans[j].ok));
    S.tests.unshift({d:Date.now(), n:R.qs.length, ok:R.ans.filter(a=>a.ok).length, topics:R.topics}); S.tests=S.tests.slice(0,30); save(); testResult(m); };
  renderQ($('#qbox',m), q, {mode:'test', idx:R.i+1, total:R.qs.length, onAnswer:(ok,v)=>{
    R.ans.push({ok,v}); R.i++;
    if(R.i>=R.qs.length) finish(); else { testRun(m); window.scrollTo(0,0); }
  }});
}
function testResult(m){
  const R = TEST.run, ok = R.ans.filter(a=>a.ok).length, pc = Math.round(100*ok/R.qs.length);
  const L='ABCDEFGH';
  m.innerHTML = `<div class="crumb">test / výsledek</div><div class="card" style="display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:22px">
     <div class="score">${pc}%</div><div><h2 style="margin:0 0 4px">${ok} z ${R.qs.length} správně</h2><p style="margin:0">${pc>=90?'Výborně, tohle máš v malíčku.':pc>=70?'Dobrý, pár věcí ještě dopiluj.':pc>=50?'Na hraně – projdi si špatné odpovědi níž.':'Zatím to nesedí – vrať se k látce a grafům.'} · ${dur((R.end-R.start)/1000)}</p></div>
     <div class="btns" style="margin-left:auto"><button class="btn" id="again">Nový test</button><button class="btn pri" id="wrong" ${ok===R.qs.length?'disabled':''}>Zopakovat chybné</button></div></div>
    <h2>Přehled odpovědí</h2>
    ${R.qs.map((q,j)=>{const a=R.ans[j]; const your = q.type==='mc' ? (a.v!=null?L[a.v]+') '+q.opts[a.v]:'–') : (a.v?a.v.map((v,k)=>esc(q.fields[k].l)+' = '+(esc(v)||'–')).join(' · '):'–');
      const right = q.type==='mc' ? L[q.ans]+') '+q.opts[q.ans] : q.fields.map(f=>esc(f.l)+' = '+nf(f.ans)).join(' · ');
      return `<details class="card" ${a.ok?'':'open'}><summary style="cursor:pointer;display:flex;gap:12px;align-items:flex-start;list-style:none"><span class="tag ${a.ok?'acc':'bad'}">${a.ok?'✓':'✗'} ${j+1}</span><span style="flex:1;font-size:15px;line-height:1.5">${strip(q.q).slice(0,140)}${strip(q.q).length>140?'…':''}</span></summary>
       <div style="margin-top:14px"><div class="q" style="font-size:15px">${q.q}</div><div class="mono" style="font-size:13px;line-height:1.8"><span class="muted">tvoje:</span> ${your}<br><span class="muted">správně:</span> <span style="color:var(--acc)">${right}</span></div>
       <div class="fb"><div class="sol">${q.sol}</div>${q.viz?`<div class="solviz">${miniShift(q.viz)}</div>`:''}</div></div></details>`;}).join('')}`;
  $('#again',m).onclick=()=>{ TEST.run=null; vTest(m); };
  $('#wrong',m).onclick=()=>{ const w=R.qs.filter((_,j)=>!R.ans[j].ok); TEST.run={qs:shuffle(w,rng(Date.now())), i:0, ans:[], topics:R.topics, start:Date.now(), done:false}; testRun(m); };
}

/* ---------- hledání ---------- */
let IDX=null;
function buildIdx(){
  IDX=[];
  TOPICS.forEach(t=>{
    IDX.push({k:'téma', t:t.name, x:t.desc, h:`#/t/${t.id}`});
    t.sections.forEach((s,i)=>IDX.push({k:'látka · '+t.name, t:s.t, x:strip(s.html), h:`#/t/${t.id}`}));
    CATS[t.id].forEach(([c,n,d])=>IDX.push({k:'procvičování · '+t.name, t:n, x:d, h:`#/t/${t.id}/p/${c}/0`}));
  });
  FORMULAS.forEach(f=>IDX.push({k:'vzorec · '+TOP[f[0]].name, t:f[1], x:f[2], h:`#/t/${f[0]}/f`}));
  QS.forEach(q=>{ const l=qsOf(q.topic,q.cat); IDX.push({k:'příklad · '+catName(q.topic,q.cat)+(q.src?' · '+q.src:''), t:'', x:strip(q.q)+' '+(q.type==='mc'?q.opts.join(' '):''), h:`#/t/${q.topic}/p/${q.cat}/${l.indexOf(q)}`}); });
}
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function vSearch(m, q0){
  if(!IDX) buildIdx();
  m.innerHTML = `<div class="crumb"><a href="#/">ekonomie</a> / hledat</div><h1>Hledat</h1><p class="lead">Látka, vzorce i jednotlivé příklady. Zkus „substitut“, „MRS“, „2/58“ nebo „trdelník“.</p>
    <div class="search">${icon('search')}<input id="sq" type="search" placeholder="co hledáš?" aria-label="Hledat" value="${esc(q0)}"></div><div id="sres"></div>`;
  const inp=$('#sq',m), out=$('#sres',m);
  const run = () => {
    const raw = inp.value.trim(); const words = norm(raw).split(/\s+/).filter(Boolean);
    history.replaceState(null,'','#/hledat'+(raw?'?q='+encodeURIComponent(raw):''));
    if(!words.length){ out.innerHTML = `<div class="btns">${['poptávka','substitut','rovnováha','mezní užitek','MRS','linie rozpočtu','produkční funkce','MC','zisk','2/21','6/34'].map(w=>`<button class="btn" data-w="${w}">${w}</button>`).join('')}</div>`; out.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.w; run();}); return; }
    const res = IDX.map(e=>{ const hay=norm(e.t+' '+e.x+' '+e.k); if(!words.every(w=>hay.includes(w))) return null; let sc=0; words.forEach(w=>{ if(norm(e.t).includes(w)) sc+=5; if(e.k.startsWith('vzorec')||e.k.startsWith('látka')||e.k==='téma') sc+=2; }); return {e,sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40);
    const hl = s => { let h=esc(s); words.forEach(w=>{ if(w.length<2) return; const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h=h.replace(re,'<mark>$1</mark>'); }); return h; };
    const snip = (x) => { const nx=norm(x); const p=Math.max(0, nx.indexOf(words[0])-60); return (p?'…':'')+x.slice(p, p+200)+(x.length>p+200?'…':''); };
    out.innerHTML = res.length ? `<p class="muted mono" style="font-size:12px">${res.length===40?'40+':res.length} výsledků</p>`+res.map(({e})=>`<a class="res" href="${e.h}"><div class="k">${esc(e.k)}</div>${e.t?`<div style="font-weight:600;margin-bottom:4px">${hl(e.t)}</div>`:''}<div class="x">${hl(snip(e.x))}</div></a>`).join('') : `<p>Nic jsem nenašel. Zkus jiné slovo nebo jen jeho část.</p>`;
  };
  inp.oninput = run; run(); inp.focus();
}

/* ---------- pokrok ---------- */
function vProgress(m){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({d, s:secDay(today(d))}); }
  const mx = Math.max(60, ...days.map(x=>x.s));
  const DN=['ne','po','út','st','čt','pá','so'];
  const att=Object.values(S.res);
  m.innerHTML = `<div class="crumb"><a href="#/">ekonomie</a> / pokrok</div><h1>Pokrok</h1><p class="lead">Čas se měří, když máš appku otevřenou a něco děláš (po 2 min nečinnosti se zastaví).</p>
    <div class="grid g4" style="margin-bottom:18px">
      <div class="card stat"><span class="v acc">${dur(secDay(today()))}</span><span class="l">dnes</span></div>
      <div class="card stat"><span class="v">${dur(secWeek())}</span><span class="l">7 dní</span></div>
      <div class="card stat"><span class="v">${dur(secAll())}</span><span class="l">celkem</span></div>
      <div class="card stat"><span class="v">${att.length}</span><span class="l">zkoušených příkladů</span></div>
    </div>
    <div class="card"><h2>Posledních 7 dní</h2><div class="week">${days.map(x=>`<div class="c"><span class="m">${x.s>=60?Math.round(x.s/60):''}</span><div class="b ${x.s<60?'z':''}" style="height:${Math.max(2,100*x.s/mx)}%"></div><span class="d">${DN[x.d.getDay()]}</span></div>`).join('')}</div><p class="muted mono" style="font-size:11px;margin:10px 0 0">minuty za den</p></div>
    <div class="card"><h2>Podle témat</h2>${TOPICS.map(t=>{const l=qsOf(t.id), r=l.map(q=>S.res[q.id]).filter(Boolean), f=r.filter(x=>x.first).length;
      return `<div class="rowp"><a href="#/t/${t.id}" style="color:var(--text);text-decoration:none"><b class="mono" style="color:var(--acc);font-size:12px">${t.n}</b> ${t.name}<div class="muted" style="font-size:12px;margin-top:3px">${solvedOf(l)}/${l.length} vyřešeno · napoprvé ${r.length?Math.round(100*f/r.length)+' %':'–'}</div></a><div class="bar"><i style="width:${pctOf(l)}%"></i></div><span class="mono">${dur(secTopic(t.id))}</span></div>`;}).join('')}</div>
    <div class="card"><h2>Poslední testy</h2>${S.tests.length?S.tests.slice(0,10).map(x=>`<div class="rowp"><span>${new Date(x.d).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} <span class="muted" style="font-size:12px">· ${x.topics.map(t=>TOP[t]?TOP[t].n:'').join(', ')}</span></span><div class="bar"><i style="width:${100*x.ok/x.n}%"></i></div><span class="mono">${x.ok}/${x.n}</span></div>`).join(''):'<p class="muted" style="margin:0">Zatím žádný test. <a href="#/test">Spustit první</a></p>'}</div>
    <div class="btns" style="margin-top:22px"><button class="btn ghost" id="reset">Smazat pokrok</button></div>`;
  twoStep($('#reset',m), 'Opravdu smazat vše? Klikni znovu', ()=>{ S={res:{},time:{},tests:[]}; save(); vProgress(m); });
}

shell(); route();

</script>
